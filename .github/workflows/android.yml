name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: legal-atlas-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # На main свежий APK публикуется в релизе apk-latest: его удобно скачать прямо с телефона.
      - name: Publish apk-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk legal-atlas.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest legal-atlas.apk --prerelease \
            --title "Атлас права (последняя сборка)" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Откройте эту страницу на телефоне и скачайте legal-atlas.apk."
